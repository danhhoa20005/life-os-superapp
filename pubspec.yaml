name: life_os
description: "LifeOS — Một ứng dụng. Cả cuộc sống. (Clean Architecture + BLoC + Menu Dấu + Siêu Nhanh v3.6)"
publish_to: 'none'
version: 3.6.0+21

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  http: ^1.3.0
  intl: any
  bloc_concurrency: ^0.3.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  uuid: ^4.6.0
  crypto: ^3.0.8
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_life_os.png
    - assets/branding/logo_horizontal_primary.png
    - assets/branding/logo_horizontal_white.png
    - assets/branding/logo_stacked_primary.png
    - assets/branding/logo_symbol_color.png
    - assets/branding/logo_symbol_white.png
    - assets/branding/app_icon_512.png
    - assets/images/splash_hero.png
    - assets/images/auth_hero.png
    - assets/images/onboarding_privacy.png
    - assets/images/dashboard_banner.png
    - assets/images/finance_illustration.png
    - assets/images/family_split_illustration.png
    - assets/images/planning_assets_illustration.png
    - assets/icons/ic_nav_today.png
    - assets/icons/ic_nav_finance.png
    - assets/icons/ic_nav_calendar.png
    - assets/icons/ic_nav_family.png
    - assets/icons/ic_nav_assets.png
    - assets/icons/ic_cat_food.png
    - assets/icons/ic_cat_housework.png
    - assets/icons/ic_cat_housing.png
    - assets/icons/ic_cat_utilities.png
    - assets/icons/ic_cat_shopping.png
    - assets/icons/ic_cat_income.png
