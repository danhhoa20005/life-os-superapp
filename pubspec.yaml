name: life_os
description: "Life OS — Super App Quản lý Cuộc sống & Gia đình (Clean Architecture + BLoC, Tammy x Apple Design System)"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  http: ^1.3.0
  intl: any
  bloc_concurrency: ^0.3.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  uuid: ^4.6.0
  crypto: ^3.0.8
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.5.0
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_life_os.png
    - assets/images/splash_hero.png
    - assets/images/auth_hero.png
    - assets/images/onboarding_privacy.png
    - assets/images/dashboard_banner.png
    - assets/images/finance_illustration.png
    - assets/images/family_split_illustration.png
    - assets/images/planning_assets_illustration.png
