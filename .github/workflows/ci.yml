name: Life OS Flutter CI, Emulator Security & Dual-Flavor Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-flutter-and-android-flavors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (Required for Android Gradle & NDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Pinned Stable Toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install pub dependencies (Locked)
        run: flutter pub get

      - name: Verify Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Strict Static Analysis Gate (Zero Errors, Warnings & Infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Architecture, Security, Property/Fuzz, BLoC, Widget & E2E Tests with Coverage
        run: flutter test --coverage --reporter expanded

      - name: Verify Production Web Release Build
        run: flutter build web --release

      - name: Verify Android GitHub Flavor Native Kotlin + C++17 NDK Debug Build
        run: flutter build apk --debug --flavor github --target-platform android-arm64

      - name: Verify Android Play Flavor Clean App Bundle Debug Build
        run: flutter build appbundle --debug --flavor play

  verify-cloud-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm ci

      - name: TypeScript strict typecheck & unit test suite
        run: |
          npm run typecheck
          npm test

  verify-firebase-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Required by Cloud Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI & Build Cloud Functions Tests
        run: |
          npm install -g firebase-tools
          npm --prefix functions ci
          npm --prefix functions run build

      - name: Execute Live Auth + Firestore Emulator Security Attack & Integration Suite
        run: |
          firebase emulators:exec --only auth,firestore --project demo-life-os "node --test firebase/rules_tests/run_emulator_rules_tests.mjs functions/lib/test/realtime_banking.test.js functions/lib/test/family_invites.test.js functions/lib/test/firestore_emulator.test.js"

  publish-android-ota-release:
    needs: [verify-flutter-and-android-flavors, verify-cloud-functions, verify-firebase-emulator]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LIFEOS_REQUIRE_RELEASE_SIGNING: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Release Keystore or Pre-Verified Admin Release (Fail-Closed)
        id: check_keystore
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.LIFEOS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LIFEOS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIFEOS_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LIFEOS_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lifeos-release.jks"
            echo "LIFEOS_RELEASE_STORE_FILE=$RUNNER_TEMP/lifeos-release.jks" >> "$GITHUB_ENV"
            echo "LIFEOS_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "LIFEOS_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "LIFEOS_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "has_ci_keystore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Missing production release signing secrets for ${GITHUB_REF_NAME}. Fail-closed release gate aborted."
          exit 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter (Pinned Stable Toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Build Signed GitHub Split-ABI APKs + Play AAB, Verify Signature/Metadata & Recompute SHA-256
        run: |
          flutter pub get
          SOURCE_COMMIT=$(git rev-parse HEAD)
          flutter build apk --release --flavor github --split-per-abi --dart-define=LIFEOS_BUILD_COMMIT="${SOURCE_COMMIT}"
          flutter build appbundle --release --flavor play --dart-define=LIFEOS_BUILD_COMMIT="${SOURCE_COMMIT}"

          BASE_VER="${GITHUB_REF_NAME%%+*}"
          APK_NAME="life-os-${BASE_VER}-github-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-github-arm64-v8a-release.apk "$APK_NAME"

          APKSIGNER_BIN=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2_BIN=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "$APK_NAME"

          BADGING=$("$AAPT2_BIN" dump badging "$APK_NAME")
          echo "$BADGING" | grep -q "package: name='vn.lifeos.app.life_os'"

          APK_SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "${APK_SHA256}  ${APK_NAME}  commit:${SOURCE_COMMIT}" > "${APK_NAME}.sha256"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          echo "APK_SHA256=${APK_SHA256}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> "$GITHUB_ENV"

      - name: Publish Verified GitHub Release with APK, Commit Provenance & Recomputed SHA-256
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Xác thực toàn vẹn gói cài đặt (OTA Trust Chain)
            - **SHA-256:** `${{ env.APK_SHA256 }}`
            - **Source Commit:** `${{ env.SOURCE_COMMIT }}`
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
