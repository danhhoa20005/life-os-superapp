name: Life OS Flutter CI & OTA Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-flutter-mvp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install pub dependencies
        run: flutter pub get

      - name: Static analysis (0 errors/warnings)
        run: flutter analyze

      - name: Run Architecture Guard, Domain, BLoC, Security Rules, Widget & Integration Tests
        run: flutter test --reporter expanded

      - name: Verify Production Web Build
        run: flutter build web --release

  publish-android-ota-release:
    needs: verify-flutter-mvp
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Universal Android Release APK for OTA Self-Update
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk life-os-${GITHUB_REF_NAME}.apk

      - name: Publish GitHub Release with APK Asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: life-os-${{ github.ref_name }}.apk
